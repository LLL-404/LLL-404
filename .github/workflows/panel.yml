name: data panel refresh
on:
  schedule:
    - cron: "0 19 * * *" # 每天 03:00 北京拉真实数据，数字变了才提交（在贪吃蛇/metrics 之后）
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: main-writers
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 刷新数据面板
        run: python3 .github/scripts/panel.py
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
